# One-node B300 dev pod for serve_mimo_v26_flash_tinker.py; `mimo_dev.py up` fills in ${pod}, ${node} and ${image}.
apiVersion: v1
kind: Pod
metadata:
  name: ${pod}
  labels: {app: mimo-dev}
spec:
  restartPolicy: Never
  imagePullSecrets: [{name: artifact-registry}]
  nodeSelector:
    kubernetes.io/hostname: ${node}
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  containers:
  - name: dev
    image: ${image}
    imagePullPolicy: IfNotPresent
    # The image's Miles checkout; mimo_dev.py runs the launcher and gates relative to it.
    workingDir: /root/miles
    securityContext: {runAsUser: 0, runAsGroup: 0, capabilities: {add: [IPC_LOCK]}}
    env:
    - {name: PYTHONUNBUFFERED, value: "1"}
    - {name: RAY_DEDUP_LOGS, value: "0"}
    - {name: HF_HOME, value: /data/model-cache/huggingface}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
    - {name: SGLANG_DG_CACHE_DIR, value: /data/model-cache/nodes/$(NODE_NAME)/deep_gemm}
    - {name: TORCHINDUCTOR_CACHE_DIR, value: /data/model-cache/nodes/$(NODE_NAME)/torchinductor}
    - {name: TRITON_CACHE_DIR, value: /data/model-cache/nodes/$(NODE_NAME)/triton}
    - {name: NCCL_SOCKET_IFNAME, value: eth0}
    - {name: GLOO_SOCKET_IFNAME, value: eth0}
    command: [bash, -lc, "sleep infinity"]
    resources:
      requests: {nvidia.com/gpu: 8, cpu: "64", memory: 512Gi}
      limits: {nvidia.com/gpu: 8, memory: 3200Gi}
    volumeMounts:
    - {name: model-cache, mountPath: /data/model-cache}
    - {name: shared-volume, mountPath: /mnt/shared-volume}
    - {name: dshm, mountPath: /dev/shm}
  volumes:
  - {name: model-cache, hostPath: {path: /data/trajectory/model-cache, type: DirectoryOrCreate}}
  - {name: shared-volume, emptyDir: {sizeLimit: 500Gi}}
  - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 256Gi}}
